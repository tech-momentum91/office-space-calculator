<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/vite.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Office Space Calculator - Phi Design</title>
  </head>
  <body>
    <div id="root">
      <div
        style="
          display: flex;
          align-items: center;
          justify-content: center;
          min-height: 100vh;
          font-family: system-ui;
        "
      >
        <div style="text-align: center">
          <div
            style="
              width: 48px;
              height: 48px;
              border: 4px solid #e5e7eb;
              border-top-color: #2563eb;
              border-radius: 50%;
              margin: 0 auto 16px;
              animation: spin 1s linear infinite;
            "
          ></div>
          <p style="color: #6b7280">Loading Office Space Calculator...</p>
        </div>
      </div>
    </div>
    <style>
      @keyframes spin {
        to {
          transform: rotate(360deg);
        }
      }
    </style>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
